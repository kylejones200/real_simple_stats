name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  # ---------------------------------------------------------------------------
  # Binary wheels. The extension is built against the CPython limited API
  # (abi3-py312), so ONE wheel per platform serves 3.12, 3.13, 3.14 and later
  # without a rebuild.
  # ---------------------------------------------------------------------------
  wheels:
    name: Wheel - ${{ matrix.platform.os }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest,   target: x86_64,  manylinux: auto }
          - { os: ubuntu-latest,   target: aarch64, manylinux: auto }
          - { os: macos-latest,    target: aarch64, manylinux: '' }
          - { os: macos-13,        target: x86_64,  manylinux: '' }
          - { os: windows-latest,  target: x64,     manylinux: '' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
          sccache: 'true'

      # Cross-built aarch64 wheels cannot be executed on this runner, so the
      # smoke test is limited to natively built ones.
      - name: Smoke-test the wheel (native targets only)
        if: matrix.platform.target == 'x86_64' || matrix.platform.target == 'x64'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links dist real_simple_stats
          cd /tmp || cd $TEMP
          python -c "
          import real_simple_stats as rss
          print('version', rss.__version__)
          assert abs(rss.mean([1, 2, 3]) - 2.0) < 1e-12
          print('wheel smoke test passed')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish-testpypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi'
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  publish-pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'pypi')
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

      - name: Attach artifacts to the GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post-publish:
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the published package installs and runs
        run: |
          sleep 60
          pip install real-simple-stats --upgrade
          cd /tmp
          python -c "import real_simple_stats as r; print('installed', r.__version__)"
          rss-calc --help
